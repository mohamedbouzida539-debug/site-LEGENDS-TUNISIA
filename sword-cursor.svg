<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g transform="rotate(-35 16 16)" stroke-linejoin="round">
    <!-- curved falcata-style blade -->
    <path d="M16,1
             C13,4 9,7 9,13
             C9,17 12,19.5 15,20
             L18,20
             C20,14 20,8 18,4
             C17.5,2.5 16.7,1.5 16,1 Z"
          fill="#f4efe2" stroke="#1b140d" stroke-width="0.7"/>
    <path d="M16,2.2 C13.8,5 11,8 11,13 C11,16 13,18.2 15.3,19.1"
          fill="none" stroke="#a8a08e" stroke-width="0.5" opacity="0.8"/>
    <!-- crossguard -->
    <rect x="12" y="20.2" width="8" height="1.8" rx="0.9" fill="#e8c14a" stroke="#1b140d" stroke-width="0.6"/>
    <!-- grip: dark wrap with gold bindings -->
    <rect x="14.4" y="22" width="3.2" height="5.6" rx="1" fill="#1c1712" stroke="#1b140d" stroke-width="0.6"/>
    <line x1="14.4" y1="23.3" x2="17.6" y2="23.3" stroke="#c9a227" stroke-width="0.7"/>
    <line x1="14.4" y1="24.9" x2="17.6" y2="24.9" stroke="#c9a227" stroke-width="0.7"/>
    <line x1="14.4" y1="26.4" x2="17.6" y2="26.4" stroke="#c9a227" stroke-width="0.7"/>
    <!-- pommel: stylised bird head -->
    <path d="M14.3,27.4
             C13.6,28.6 13.8,30 15,30.8
             C16.2,31.6 18,31.4 19.3,30.2
             C20.4,29.2 20.7,28 20.1,27.1
             C19.2,25.8 17,25.6 15.8,26.4
             C15.1,26.8 14.6,27 14.3,27.4 Z"
          fill="#e8c14a" stroke="#1b140d" stroke-width="0.6"/>
    <path d="M19.5,28.6 L21.6,28.2 L20.3,29.9 Z" fill="#c9a227" stroke="#1b140d" stroke-width="0.5"/>
    <circle cx="16.6" cy="27.6" r="0.55" fill="#1b140d"/>
  </g>
</svg>
